calibration_set:

  # =====================================================
  # BEHEMOTH-R1-123B-v2 — NVFP4 CALIBRATION
  # Dense Mistral-Large-2411 creative-writing / RP finetune
  # with an optional <think> reasoning phase.
  # =====================================================
  #
  # Design Philosophy:
  # - The model's job is prose and character work, so the
  #   activation statistics that matter come from narrative
  #   and dialogue, not from agentic coding traces.
  # - Reasoning slice carries real chain-of-thought text so
  #   the <think> prefill path is in-distribution. Build with
  #   --think-tag think.
  # - ~1% code is retained on purpose: enough to keep 2411's
  #   latent coding range represented, not enough to bias
  #   the scales toward it.
  # - Every source here is drawn from the validated specs in
  #   data/examples/ (same columns, same formatters).
  #
  # `bucket` labels are only used for the mix report the
  # builder prints at the end. `max_seq_length` overrides the
  # global value per source and selects the output file.
  # =====================================================

  max_seq_length: 4096
  shuffle: true
  seed: 42

  # =====================================================
  # Category Summary (Total: 16,000 samples)
  # =====================================================
  # CREATIVE WRITING        (9,600 samples - 60%)  [PRIMARY]
  # ROLEPLAY                (3,200 samples - 20%)
  # GENERAL REASONING       (1,600 samples - 10%)
  # GENERAL BREADTH         (1,600 samples - 10%)
  # =====================================================

  datasets:

    # ================================================
    # CREATIVE WRITING — 9,600 samples (60%)
    # Narrative fiction, genre prose, long-form books,
    # screenplay, poetry, and creative nonfiction.
    # ================================================

    # --- Narrative fiction core (5,300) ---

    # Premium Claude-quality writing prompts
    - dataset: Gryphe/Opus-WritingPrompts
      bucket: creative_writing
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 1720

    # Community writing prompts — widest stylistic range
    - dataset: euclaise/writingprompts
      bucket: creative_writing
      split: train
      columns: [prompt, story]
      formatter: prompt_answer
      num_samples: 1400

    # GPT-4o writing prompts — genre coverage.
    # ShareGPT `conversations`, not prompt/story columns.
    - dataset: Gryphe/ChatGPT-4o-Writing-Prompts
      bucket: creative_writing
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 1300

    # Classic fiction — literary grounding
    - dataset: sam-paech/gutenberg3-generalfiction-scifi-fantasy-romance-adventure-dpo
      bucket: creative_writing
      split: train
      columns: [chosen]
      formatter: chat_completion
      num_samples: 1000

    # --- Description, world-building, atmosphere (1,600) ---

    # Claude writing — rich descriptive prose
    - dataset: anthracite-org/nopm_claude_writing_fixed
      bucket: creative_writing
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 900

    # Augmented prompts — genre variety. One flat `text` column holding a
    # "User: ... -> Rosey: ..." transcript, so raw_text, not prompt_answer.
    # Do not list splitLineIndex: raw_text takes the longest listed column.
    - dataset: fabraz/writingPromptAug
      bucket: creative_writing
      split: train
      columns: [text]
      formatter: raw_text
      num_samples: 800

    # Adventure scenarios and settings. Only 586 rows exist; do not raise.
    - dataset: PocketDoc/Dans-Prosemaxx-Adventure
      bucket: creative_writing
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 580

    # --- Long-form prose at 8192 (1,200) ---
    # Book- and script-length text, the only slice run at
    # double length. These calibrate the activation ranges
    # that show up in long RP sessions and extended scenes.
    # Emitted to a separate JSONL so quantize.py can give
    # them their own max_len. Individually these documents
    # far exceed 8192 tokens and are truncated to the
    # character budget, not discarded.

    # Full book text, one novel per row. Carries the 400 samples that
    # storytracer/US-PD-Books was supposed to provide: that dataset is
    # metadata only (ocaid, title, author, year, full_text_url) with no text
    # column, so it yielded 400 book *titles* of ~26 chars, every one of them
    # then dropped for being under --min-chars. Removed rather than fixed;
    # using it means fetching each book from archive.org separately.
    - dataset: lucadiliello/bookcorpusopen
      bucket: creative_writing
      split: train
      columns: [text]
      formatter: raw_text
      num_samples: 900
      streaming: true
      max_seq_length: 8192

    # Screenplay formatting and scene structure
    - dataset: IsmaelMousa/movies
      bucket: creative_writing
      split: train
      columns: [Script, Name]
      formatter: raw_text
      num_samples: 300
      max_seq_length: 8192

    # --- Prose rhythm and creative nonfiction (700) ---

    - dataset: merve/poetry
      bucket: creative_writing
      split: train
      columns: [content]
      formatter: raw_text
      num_samples: 250

    - dataset: Abirate/english_quotes
      bucket: creative_writing
      split: train
      columns: [quote]
      formatter: raw_text
      num_samples: 150

    - dataset: fabiochiu/medium-articles
      bucket: creative_writing
      split: train
      columns: [content, title]
      formatter: raw_text
      num_samples: 150
      streaming: true

    - dataset: sgoel9/paul_graham_essays
      bucket: creative_writing
      split: train
      columns: [text, title]
      formatter: raw_text
      num_samples: 150


    # ================================================
    # ROLEPLAY — 3,200 samples (20%)
    # Character cards, persona voice, multi-turn scenes.
    #
    # Two sources from data/examples/ are unusable:
    #   PygmalionAI/PIPPA — ships a PIPPA.py loading script and datasets v4
    #     removed script support. There is no parquet fallback either: the
    #     datasets-server returns 501 for this repo, so refs/convert/parquet
    #     was never generated. Only a manual download of the raw JSONL works.
    #   awsaf49/persona-chat — real schema is a single `text` column of
    #     781k *individual lines* in flat ConvAI2 format ("1 your persona:
    #     i like to remodel homes."). Reassembling dialogues needs stateful
    #     grouping across rows, and a single row is far under --min-chars.
    # Their 750 samples are redistributed below rather than replaced with
    # untested dataset IDs.
    # ================================================

    # Premium character-card roleplay
    - dataset: Gryphe/Sonnet3.5-Charcard-Roleplay
      bucket: roleplay
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 1150

    # High-quality filtered RP interactions
    - dataset: anthracite-org/stheno-filtered-v1.1
      bucket: roleplay
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 1000

    # Claude Opus quality RP, no refusals
    - dataset: anthracite-org/kalo-opus-instruct-22k-no-refusal
      bucket: roleplay
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 800

    - dataset: zerofata/Roleplay-Anime-Characters
      bucket: roleplay
      split: train
      columns: [messages]
      formatter: chat_completion
      num_samples: 177

    # Interactive / choice-driven adventure. The whole train split is 73 rows.
    - dataset: PocketDoc/Dans-Kinomaxx-VanillaBackrooms
      bucket: roleplay
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 73


    # ================================================
    # GENERAL REASONING — 1,600 samples (10%)
    # Explicit chain-of-thought so the <think> phase is
    # calibrated, not just the prose that follows it.
    # Build with --think-tag think.
    # ================================================

    # QwQ-style long reasoning traces (primary think-path source)
    - dataset: open-thoughts/OpenThoughts-114k
      bucket: reasoning
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 500

    # DeepSeek-R1 math reasoning traces (long CoT)
    - dataset: nvidia/OpenMathReasoning
      bucket: reasoning
      split: cot
      columns: [problem, generated_solution]
      formatter: prompt_answer
      num_samples: 250
      streaming: true

    # Competition math with step-by-step solutions
    - dataset: AI-MO/NuminaMath-CoT
      bucket: reasoning
      split: train
      columns: [problem, solution]
      formatter: prompt_answer
      num_samples: 200

    # Multi-domain science reasoning
    - dataset: nvidia/OpenScienceReasoning-2
      bucket: reasoning
      split: train
      columns: [input, output]
      formatter: prompt_answer
      num_samples: 180
      streaming: true

    # Theory of mind — the reasoning pattern closest to RP
    - dataset: PJMixers/grimulkan_theory-of-mind-ShareGPT
      bucket: reasoning
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 150

    # Physical-world reasoning — grounds scene consistency
    - dataset: PJMixers/grimulkan_physical-reasoning-ShareGPT
      bucket: reasoning
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 120

    # STEM instruction breadth
    - dataset: garage-bAInd/Open-Platypus
      bucket: reasoning
      split: train
      columns: [instruction, output]
      formatter: prompt_answer
      num_samples: 100

    # Minimal code retention (~0.6% of the whole set).
    # Set to 0 for a strictly zero-code calibration.
    - dataset: nvidia/OpenCodeInstruct
      bucket: reasoning
      split: train
      columns: [input, output]
      formatter: prompt_answer
      num_samples: 100
      streaming: true


    # ================================================
    # GENERAL BREADTH — 1,600 samples (10%)
    # Non-creative domains, to stop capability collapse
    # outside the finetune's home turf.
    # ================================================

    - dataset: HuggingFaceH4/ultrachat_200k
      bucket: breadth
      split: train_sft
      columns: [messages]
      formatter: chat_completion
      num_samples: 300

    - dataset: databricks/databricks-dolly-15k
      bucket: breadth
      split: train
      columns: [instruction, response]
      formatter: prompt_answer
      num_samples: 200

    # Human-written, high-quality instructions
    - dataset: HuggingFaceH4/no_robots
      bucket: breadth
      split: train
      columns: [messages]
      formatter: chat_completion
      num_samples: 150

    # Neural Magic's general calibration mix
    - dataset: neuralmagic/calibration
      bucket: breadth
      subset: LLM
      split: train
      columns: [messages]
      formatter: chat_completion
      num_samples: 150

    # Philosophy — dense abstract argumentation
    - dataset: ruggsea/stanford-encyclopedia-of-philosophy_instruct
      bucket: breadth
      split: train
      columns: [question, answer]
      formatter: prompt_answer
      num_samples: 130

    # Socratic dialogue — dialectical structure
    - dataset: FreedomIntelligence/SocraticChat
      bucket: breadth
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 120

    # Helpful-response baseline
    - dataset: nvidia/HelpSteer
      bucket: breadth
      split: train
      columns: [prompt, response]
      formatter: prompt_answer
      num_samples: 110

    # Medical reasoning
    - dataset: OpenMed/Medical-Reasoning-SFT-GPT-OSS-120B
      bucket: breadth
      split: train
      columns: [messages]
      formatter: chat_completion
      num_samples: 100
      streaming: true

    # Legal reasoning and structured argument
    - dataset: Alignment-Lab-AI/Lawyer-Instruct
      bucket: breadth
      split: train
      columns: [instruction, output]
      formatter: prompt_answer
      num_samples: 90

    # Finance and business
    - dataset: gbharti/finance-alpaca
      bucket: breadth
      split: train
      columns: [instruction, output]
      formatter: prompt_answer
      num_samples: 80

    # Cross-language breadth
    - dataset: HuggingFaceH4/Multilingual-Thinking
      bucket: breadth
      split: train
      columns: [user]
      formatter: raw_text
      num_samples: 70

    # Pop culture and trope vocabulary — useful for RP grounding
    - dataset: KaraKaraWitch/TvTroper-2025
      bucket: breadth
      split: train
      columns: [article]
      formatter: raw_text
      num_samples: 60

    # Practical/procedural knowledge
    - dataset: AquaV/US-Army-Survival-Sharegpt
      bucket: breadth
      split: train
      columns: [conversations]
      formatter: sharegpt
      num_samples: 40
