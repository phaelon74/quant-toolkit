[project]
name = "quantization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    # Pinned to a release, not git HEAD. 0.46.0 is the newest tagged version and
    # is the first this toolkit is verified against for the list-form quant_cfg
    # introduced in 0.44. See Install.md before changing this.
    "nvidia-modelopt[torch]==0.46.0",
    "pillow",
    "protobuf",
    "requests",
    "safetensors>=0.4",
    "sentencepiece",
    "torch>=2.10",
    "torchvision",
    "transformers==5.5.3",
]

# explicit = true is required, not cosmetic. Without it uv treats this index as
# authoritative for every package it happens to mirror -- including setuptools,
# which it pins at <=78.1.0, below the >=80 that nvidia-modelopt requires. uv
# then refuses to look at PyPI for it and resolution fails outright.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
